name: Sync Fork

on:
  schedule:
    - cron: '*/10 * * * *'   # 每小时同步一次，按需调整
  workflow_dispatch:        # 支持手动点按钮触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: tgymnich/fork-sync@v2.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          owner: CJackHwang      # 上游源仓库的所有者
          base: main             # 你自己仓库的目标分支（接收同步）
          head: main             # 上游仓库的分支（同步来源）
          merge_method: merge
